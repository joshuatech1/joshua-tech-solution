services:
  - type: web
    name: joshua-tech-solution
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@joshuatech.co.tz
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: simulated
      - key: PAYMENT_API_KEY
        sync: false
      - key: PAYMENT_SECRET_KEY
        sync: false
      - key: PAYMENT_BASE_URL
        sync: false
